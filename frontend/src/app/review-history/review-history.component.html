<section class="panel">
  <div class="panel-head">
    <div><h2>Recent reviews</h2><p>Review activity in this workspace</p></div>
    <button class="text-button" (click)="refresh.emit()">Refresh ↻</button>
  </div>
  <button
    type="button"
    class="history-row"
    *ngFor="let review of reviews"
    [class.selected]="review.id === selectedReviewId"
    [attr.aria-pressed]="review.id === selectedReviewId"
    (click)="reviewSelected.emit(review)">
    <div><b>{{review.title}}</b><small>{{review.repository}} · {{review.created_at}}</small></div>
    <span>{{review.findings.length}} findings</span>
    <strong>{{review.score}}/100</strong>
  </button>
  <div *ngIf="!reviews.length" class="empty">No reviews yet. Start your first review above.</div>
</section>
