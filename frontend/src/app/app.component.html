<div class="shell">
  <ng-container *ngIf="requestInProgress$ | async">
    <span class="progress-track"><span></span></span>
    <div class="request-progress" role="status" aria-live="polite">
      <span class="request-spinner" aria-hidden="true"></span>
      <span>Updating workspace…</span>
    </div>
  </ng-container>
  <app-sidebar
    [apiStatus]="(apiStatus$ | async) || 'checking'"
    [reviewCount]="(reviewCount$ | async) || 0">
  </app-sidebar>

  <main class="main">
    <header class="topbar">
      <div>
        <div class="eyebrow">WORKSPACE <span>/</span> {{pageTitle}}</div>
        <h1>{{pageTitle}}</h1>
        <p>{{pageDescription}}</p>
      </div>
      <div class="topbar-actions">
        <div class="api-status" [class.offline]="(apiStatus$ | async) === 'offline'">
          <span class="status-dot"></span>
          <span>{{(apiStatus$ | async) === 'connected' ? 'All systems operational' : (apiStatus$ | async) === 'offline' ? 'API unavailable' : 'Connecting to API'}}</span>
        </div>
        <button class="primary topbar-cta" routerLink="/review">
          <span aria-hidden="true">＋</span> New review
        </button>
      </div>
    </header>

    <router-outlet></router-outlet>

    <footer>ReviewPilot <span>·</span> AI-assisted insights, with humans in control.</footer>
  </main>
</div>
