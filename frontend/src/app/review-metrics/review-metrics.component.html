<section class="metrics" [attr.aria-busy]="loading">
  <ng-container *ngIf="loading; else loadedMetrics">
    <article class="metric metric-skeleton" *ngFor="let card of [1, 2, 3, 4]" aria-hidden="true">
      <span class="skeleton skeleton-label"></span>
      <span class="skeleton skeleton-value"></span>
      <span class="skeleton skeleton-caption"></span>
    </article>
    <span class="visually-hidden" role="status">Loading review metrics…</span>
  </ng-container>
  <ng-template #loadedMetrics>
  <div class="metric">
    <span>Total reviews</span>
    <strong>{{reviewCount}}</strong>
    <small>Saved in this workspace</small>
  </div>
  <div class="metric">
    <span>Average quality score</span>
    <strong>{{averageScore}}<i>/100</i></strong>
    <small>Higher is better</small>
  </div>
  <div class="metric">
    <span>Findings detected</span>
    <strong>{{findingCount}}</strong>
    <small>Across completed reviews</small>
  </div>
  <div class="metric">
    <span>High-priority findings</span>
    <strong>{{highPriorityFindingCount}}</strong>
    <small>Critical and high severity across reviews</small>
  </div>
  </ng-template>
</section>
